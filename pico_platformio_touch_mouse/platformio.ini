[env:raspberry-pi-pico]
board                   = pico
framework               = arduino
platform                = https://github.com/maxgerhardt/platform-raspberrypi.git
board_build.core        = earlephilhower

; UART monitor baud rate — matches Serial1.begin(115200) in main.cpp
monitor_speed           = 115200

; Map SPI0 to the XPT2046 wiring.  CS (GPIO 17) is driven manually.
build_flags =
    -D PICO_DEFAULT_SPI=0
    -D PICO_DEFAULT_SPI_SCK_PIN=18
    -D PICO_DEFAULT_SPI_TX_PIN=19
    -D PICO_DEFAULT_SPI_RX_PIN=16
    -D PICO_DEFAULT_SPI_CSN_PIN=17